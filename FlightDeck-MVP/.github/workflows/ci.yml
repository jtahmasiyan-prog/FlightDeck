name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 * * * *"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint (basic)
        run: python - <<'PY'
import sys
try:
    import streamlit
    print("ok")
except Exception as e:
    print("import-failure", e)
    sys.exit(1)
PY
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: flightdeck:ci
